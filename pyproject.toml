[project]
name = "handout-cleaner"
version = "1.0.3"
description = "Offline portable Chinese teaching handout cleaner"
requires-python = ">=3.12"
dependencies = ["python-docx>=1.2", "python-pptx>=1.0", "pymupdf>=1.26", "rapidocr-onnxruntime==1.4.4", "PySide6-Essentials>=6.8", "pdf2docx>=0.5.8", "Pillow>=11"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
